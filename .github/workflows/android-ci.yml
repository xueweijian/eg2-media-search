name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + Build debug APK
        run: ./gradlew test assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eg2-media-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 真实运行时自测：模拟器上跑真 litert 栈（方案 ②，堵"零运行时验证"窟窿）
  e2e-emulator:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ~/model
          key: eg2-740m-generic-v1

      - name: Download model (485MB)
        run: |
          mkdir -p ~/model
          F=~/model/embeddinggemma-2-740m.litertlm
          if [ ! -f "$F" ]; then
            curl -sL --retry 3 -o "$F" \
              "https://huggingface.co/litert-community/embeddinggemma-2-740m-litert-lm/resolve/main/embeddinggemma-2-740m.litertlm"
          fi
          ls -lh ~/model/
          test $(stat -c%s "$F") -gt 400000000

      - name: Install emulator system image
        run: |
          sdkmanager --install "system-images;android-30;google_apis;x86_64" > /dev/null 2>&1 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Run instrumented e2e (real litert stack, CPU fallback)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew installDebug installDebugAndroidTest --no-daemon
            adb push ~/model/embeddinggemma-2-740m.litertlm /data/local/tmp/eg2.litertlm
            adb shell run-as com.xueweijian.eg2media mkdir -p files/models
            adb shell run-as com.xueweijian.eg2media cp /data/local/tmp/eg2.litertlm files/models/embeddinggemma-2-740m.litertlm
            adb shell run-as com.xueweijian.eg2media ls -la files/models
            adb shell rm /data/local/tmp/eg2.litertlm
            adb shell am instrument -w com.xueweijian.eg2media.test/androidx.test.runner.AndroidJUnitRunner > /tmp/inst.log 2>&1
            cat /tmp/inst.log
            ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" /tmp/inst.log

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
